schema: spec-driven

context: |
  專案：一個在 macOS 上運行、以 Go 開發的俄羅斯方塊（Tetris）遊戲。
  階段：專案仍在早期，優先建立清楚的結構、正確的核心玩法與可測試性，而不是過早追求包裝。

  文件語言規範：
  - 專案內文件一律使用繁體中文。
  - 包含 proposal、design、specs、tasks、驗證紀錄與其他內部說明文件。
  - 外部術語可保留英文，但標題、說明與條列內容應以繁體中文為主。

  主要目標：
  - 建立可玩且可維護的 Tetris 實作。
  - 保持遊戲規則與渲染、輸入處理分離。
  - 優先以漸進方式交付棋盤邏輯、方塊行為、碰撞檢查、消行、計分、等級提升、暫停/重新開始與遊戲結束。

  技術與平台限制：
  - 語言：Go。
  - 目標平台：macOS。
  - 優先使用 Go 標準庫與少量、維護良好的套件。
  - 除非能明確解決問題，否則避免引入過重框架。

  架構指引：
  - 核心規則應可在不啟動圖形介面的情況下測試。
  - 避免把所有邏輯都放進 main.go。
  - 開始實作時，優先朝 `cmd`、`internal/game`、`internal/app`、`internal/input`、`internal/render`、`assets`、`testdata` 等模組化結構發展。
  - 棋盤尺寸、更新速度、計分與等級提升等可調常數應集中管理。
  - Tetromino 形狀與旋轉狀態應保持一致表示法，以利測試與渲染。
  - 若有隨機出塊，實作應盡量能注入或控制隨機來源，方便測試。

  玩法預期：
  - 至少支援左移、右移、加速下落、旋轉、暫停/繼續、重新開始與遊戲結束。
  - 至少顯示分數、等級與下一個方塊。
  - 若複雜度可控，暫存方塊（hold）可作為選配。
  - 輸入反應應穩定，不要與渲染節奏過度耦合。

  工程慣例：
  - 避免過度抽象；只有在重複邏輯或可替換需求明確時才抽出介面。
  - 函式與型別維持小而明確的責任邊界。
  - 除非明確要求，否則不要加入網路、排行榜、帳號等非核心功能。
  - 每次有意義的變更都應交代改了什麼、為什麼這樣改、以及如何驗證。

  驗證要求：
  - 優先為旋轉規則、碰撞判定、消行、計分與遊戲結束條件撰寫單元測試。
  - 若涉及 UI 或遊玩流程，需附上手動驗證步驟。
  - 若已有可驗證程式碼，完成前應執行 `gofmt` 與 `go test ./...`。

rules:
  proposal:
    - 內容一律使用繁體中文撰寫。
    - 分開描述玩家目標與工程目標。
    - 必須包含範圍、非目標、風險與驗證方式。
    - 要明確指出這次變更影響核心規則、渲染、輸入處理或專案結構中的哪些部分。
    - 除非需求明確要求，否則不要提議非核心功能。
  specs:
    - 內容一律使用繁體中文撰寫。
    - 具體定義玩法行為，包含輸入、狀態轉移、失敗條件與邊界情況。
    - 同一份變更若同時涉及規則與渲染，必須清楚區分規則邏輯與渲染細節。
    - 要指出哪些常數或可調參數必須集中管理。
    - 若涉及隨機性，必須說明如何以可重現方式測試。
  tasks:
    - 內容一律使用繁體中文撰寫。
    - 將工作拆成小而可執行、輸出清楚的任務。
    - 驗證工作必須直接寫進任務清單，不可事後補上。
    - 任務排序優先保證核心規則正確，再處理 UI 與表面優化。
    - 若任務會改動架構或目錄結構，需明確標示。
